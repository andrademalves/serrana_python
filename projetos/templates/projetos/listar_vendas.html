{% extends 'base_with_sidebar.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <h2><i class="fas fa-shopping-cart"></i> {{ titulo }}</h2>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-12">
            <a href="{% url 'projetos:criar_venda' %}" class="btn btn-warning">
                <i class="fas fa-cart-plus"></i> Nova Venda
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5><i class="fas fa-list"></i> Lista de Vendas Diretas</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">Nenhuma venda cadastrada ainda.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
